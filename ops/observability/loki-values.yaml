deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  compactor:
    delete_request_store: filesystem
    retention_enabled: true
  limits_config:
    retention_period: 720h
  schemaConfig:
    configs:
      - from: "2024-04-01"
        index:
          period: 24h
          prefix: index_
        object_store: filesystem
        schema: v13
        store: tsdb
  storage:
    type: filesystem

singleBinary:
  nodeSelector:
    kubernetes.io/hostname: k8s-master
  persistence:
    enabled: true
    enableStatefulSetAutoDeletePVC: false
    size: 10Gi
    storageClass: local-path
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  tolerations:
    - effect: NoSchedule
      key: node.kubernetes.io/network-unavailable
      operator: Exists

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
gateway:
  enabled: false
resultsCache:
  enabled: false
